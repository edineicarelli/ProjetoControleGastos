events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Configuração de Upstream para o container FastAPI
    upstream backend {
        server finance-control:8085;
    }

    # Redireciona HTTP (porta 80) para HTTPS (porta 443)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS (porta 443)
    server {
        listen 443 ssl http2;
        server_name _;

        # Caminho dos certificados SSL (substitua pelos seus certificados)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Parâmetros recomendados de SSL / Segurança
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Cabeçalhos de Segurança
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        # Proxy Reverso para a aplicação
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # Suporte a WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cabeçalhos de encaminhamento
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
