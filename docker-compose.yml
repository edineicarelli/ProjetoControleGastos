version: '3.8'

services:
  # =========================================================================
  # Proxy Reverso Caddy com HTTPS / TLS Automático (Let's Encrypt / ZeroSSL)
  # =========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: controle_gastos_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - finance-control

  # =========================================================================
  # Aplicação Principal (FastAPI + Bot Telegram + APScheduler)
  # =========================================================================
  finance-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controle_gastos_app
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      # Opcional: manter acesso direto na porta 8085 caso necessário para testes locais
      - "${PORT:-8085}:8000"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: "sqlite:////app/data/finance_control.db"
      HOST: "0.0.0.0"
      PORT: "8000"
      BASE_URL: ${BASE_URL:-https://localhost}
      DEFAULT_CURRENCY: "R$"
      DEFAULT_TIMEZONE: "America/Sao_Paulo"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - finance_data:/app/data
      - finance_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/dashboard || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  finance_data:
    name: controle_gastos_data
  finance_uploads:
    name: controle_gastos_uploads
  caddy_data:
    name: controle_gastos_caddy_data
  caddy_config:
    name: controle_gastos_caddy_config
